name: Feature Request
description: Suggest an idea, enhancement, or new content/feature for the project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement! Please provide details below.
  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. (e.g., "I'm always frustrated when...")
      placeholder: "Describe the current limitation..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "I would like a feature that allows..."
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Describe alternatives you've considered
      description: Are there any alternative features or workarounds you've thought of?
      placeholder: "Alternative solutions..."
    validations:
      required: false
  - type: additional context
    id: extra-info
    attributes:
      label: Additional Context
      description: Add any mockups, examples, or extra context about the feature request here.
      placeholder: "Any other details..."
    validations:
      required: false
