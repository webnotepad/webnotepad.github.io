name: Bug Report
description: Create a report to help us fix a bug or broken functionality.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
  - type: textarea
    id: what-happened
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I click on X, Y happens instead of Z..."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: List the steps clearly so we can replicate the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "I expected the page to..."
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / Environment
      description: What browser or device are you using?
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Safari
        - Mobile Browser
        - Other
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or error logs about the problem here.
      placeholder: "Paste console errors or logs..."
    validations:
      required: false
